# Deploy automático de las apps al mergear en main.
# Solo corre si el merge toca algo dentro de Frontend/.
name: Deploy apps (main)

on:
  push:
    branches: ['main']
    paths: ['Frontend/**']

jobs:
  build_android:
    name: Build APK Android
    type: build
    params:
      platform: android
      profile: preview

  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Subir a TestFlight
    needs: [build_ios]
    type: submit
    params:
      platform: ios
      build_id: ${{ needs.build_ios.outputs.build_id }}
