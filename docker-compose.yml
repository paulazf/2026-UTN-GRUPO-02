services:

  db:
    image: postgres:18
    container_name: agiles_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"

  api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: agiles_api
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./Backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  mobile:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: agiles_mobile
    restart: unless-stopped
    # EXPO_MODE=lan (por defecto) o tunnel. Lo setea scripts/dev.sh (--tunnel).
    command: sh -c "npm install --no-audit --no-fund && npm run start -- --${EXPO_MODE:-lan}"
    environment:
      EXPO_NO_TELEMETRY: "1"
      EXPO_TOKEN: ${EXPO_TOKEN:-}
    stdin_open: true
    tty: true
    volumes:
      - ./Frontend:/app
      - /app/node_modules
      - expo_credentials:/root/.expo
    ports:
      - "8081:8081"
      - "8082:8082"
      - "19000:19000"
    depends_on:
      - api

  # Solo con ./scripts/dev.sh --tunnel: expone la API por internet (Cloudflare Quick Tunnel, sin cuenta)
  # para que la app funcione aunque el celular no esté en la misma red (datos móviles, wifi con aislamiento, firewall).
  api_tunnel:
    image: cloudflare/cloudflared:2025.9.1
    container_name: agiles_api_tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://api:8000
    depends_on:
      - api

volumes:
  postgres_data:
  media_data:
  expo_credentials: