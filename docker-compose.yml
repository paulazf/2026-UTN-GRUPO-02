services:

  db:
    image: postgres:16-alpine
    container_name: agiles_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: agiles_api
    restart: unless-stopped
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./Backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  mobile:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: agiles_mobile
    restart: unless-stopped
    command: npm run start -- --lan
    environment:
      EXPO_NO_TELEMETRY: "1"
    stdin_open: true
    tty: true
    volumes:
      - ./Frontend:/app
      - /app/node_modules
      - expo_credentials:/root/.expo
    ports:
      - "8081:8081"
      - "8082:8082"
      - "19000:19000"
    depends_on:
      - api

volumes:
  postgres_data:
  media_data:
  expo_credentials: